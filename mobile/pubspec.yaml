name: cobbler_accounting
description: "نظام إبرة وخيط الإسكافي — نقاط البيع والورشة والمحاسبة (Needle & Thread Cobbler POS)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  mobile_scanner: ^7.0.0
  printing: ^5.13.4
  pdf: ^3.11.1
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/cobblers-app-icon.png"
  adaptive_icon_background: "#0B0B0C"
  adaptive_icon_foreground: "assets/images/cobblers-app-icon.png"
  windows:
    generate: true
    image_path: "assets/images/cobblers-app-icon.png"
  macos:
    generate: true
    image_path: "assets/images/cobblers-app-icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: SaudiRiyal
      fonts:
        - asset: assets/fonts/SaudiRiyal.ttf
